
<!DOCTYPE html>
<html>
<head>
    <title>Clock Timer</title>
</head>
<body>
    <p id="timer"></p>

    <script>
        function updateTimer() {
            const now = new Date();
            document.getElementById("timer").textContent = now.toLocaleString();
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
